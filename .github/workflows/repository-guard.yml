name: Repository Guard

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify repository integrity
      run: |
        echo "Validating repository structure and assets..."
        test -f README.md
        test -f index.html
        test -f pyramid.py
        test -f pyproject.toml
        echo "Integrity check passed."
